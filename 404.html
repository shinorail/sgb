<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | SGB</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --border-color: #ffffff;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'DotGothic16', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        /* ドラクエ風メッセージウィンドウ */
        .window {
            border: 4px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 80%;
            position: relative;
            background-color: var(--bg-color);
            box-shadow: 0 0 0 4px var(--bg-color), 0 0 0 8px var(--border-color);
        }

        .message {
            font-size: 1.5rem;
            line-height: 2;
            margin-bottom: 20px;
        }

        /* 点滅するカーソル（▼） */
        .cursor {
            display: inline-block;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid var(--border-color);
            animation: blink 0.8s infinite;
            float: right;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        .back-link {
            display: block;
            margin-top: 40px;
            color: #5865F2;
            text-decoration: none;
            font-size: 1.2rem;
        }

        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="message">
            おっと！　ページが　みつからない　ようだ。<br>
            どうやら　まものに　たべられて　しまったらしい！
        </div>
        <div class="cursor"></div>
    </div>

    <a href="index.html" class="back-link">▶ おしろ（ホーム）に　もどる</a>

</body>
</html>
