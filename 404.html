<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Lost in Adventure | SGB PROJECT</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
body { font-family: 'Noto Sans JP', sans-serif; background-color: #020617; color: #f1f5f9; margin: 0; }
.glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
#bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; }
#mobile-menu { transition: transform 0.3s ease-in-out; transform: translateX(100%); }
#mobile-menu.active { transform: translateX(0); }
</style>
</head>
<body class="min-h-screen flex flex-col">
<canvas id="bg-canvas"></canvas>
<div id="nav-container"></div>
<div class="flex-grow flex items-center justify-center pt-20">
<div class="max-w-xl w-full px-6 text-center z-10">
<h1 class="text-4xl font-black mb-4 text-white">道に迷いましたか？</h1>
<div class="glass p-8 rounded-[32px] mb-10 border border-white/10 shadow-2xl">
<p class="text-slate-400 mb-6">おっと、ここは未開拓のエリアのようです。


冒険者ギルドの地図には載っていません。</p>
<div class="bg-black/40 p-4 rounded-xl font-mono text-sm text-red-400 text-left">
<span class="text-slate-600">>></span> Error: Page_Not_Found


<span class="text-slate-600">>></span> Status: 404
</div>
</div>
<a href="index.html" class="bg-sky-500 hover:bg-sky-400 text-white font-black py-4 px-10 rounded-2xl transition shadow-lg shadow-sky-500/20 inline-block">拠点の町へ戻る</a>
</div>
</div>
<script src="nav.js"></script>
<script>
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
class Particle {
constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.speed = Math.random() * 0.3 + 0.05; this.opacity = Math.random() * 0.3; }
update() { this.y -= this.speed; if (this.y < 0) this.y = canvas.height; }
draw() { ctx.fillStyle = rgba(96, 165, 250, ${this.opacity}); ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
}
function createParticles() { particles = []; for (let i = 0; i < 60; i++) particles.push(new Particle()); }
function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
window.addEventListener('resize', () => { initCanvas(); createParticles(); });
initCanvas(); createParticles(); animate();
</script>
</body>
</html>
