<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGB Official Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
body { font-family: 'Noto Sans JP', sans-serif; background-color: #020617; color: #f1f5f9; scroll-behavior: smooth; overflow-x: hidden; margin: 0; }
.glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
.gradient-text { background: linear-gradient(135deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
<div id="nav-container"></div>

<header class="relative pt-48 pb-24 px-6 text-center">
    <div class="max-w-4xl mx-auto relative z-10" data-aos="fade-up">
        <h1 class="text-6xl md:text-8xl font-black mb-8 leading-[1.1] tracking-tight">
            新時代の<br><span class="gradient-text">放置型RPG。</span>
        </h1>
        <p class="text-xl text-slate-400 mb-12 max-w-2xl mx-auto">Discordを開くだけで、そこは異世界。</p>
        <div class="flex flex-wrap justify-center gap-6">
            <a href="[https://discord.gg/cV9ECW5KG2](https://discord.gg/cV9ECW5KG2)" target="_blank" class="bg-sky-500 text-white font-black py-4 px-12 rounded-2xl shadow-lg shadow-sky-500/20 hover:scale-105 transition">今すぐ開始</a>
            <a href="commands.html" class="glass font-bold py-4 px-12 rounded-2xl hover:bg-white/10 transition text-white">ガイドを見る</a>
        </div>
    </div>
</header>

<main class="max-w-6xl mx-auto px-6 space-y-40 pb-40">
    <section id="about" class="grid lg:grid-cols-2 gap-16 items-center" data-aos="fade-right">
        <div>
            <h2 class="text-4xl font-black mb-8 italic underline decoration-sky-500 underline-offset-8 text-white">SGBとは？</h2>
            <p class="text-slate-300 text-lg leading-relaxed">24時間稼働するサーバー上で、あなたのキャラクターは常に成長を続けます。冒険は止まりません。</p>
        </div>
        <div class="glass p-2 rounded-[40px] overflow-hidden">
            <img src="[https://images.unsplash.com/photo-1614728263952-84ea256f9679?auto=format&fit=crop&q=80&w=800](https://images.unsplash.com/photo-1614728263952-84ea256f9679?auto=format&fit=crop&q=80&w=800)" alt="RPG Image" class="rounded-[32px] w-full h-[400px] object-cover">
        </div>
    </section>

    <section id="monster" data-aos="fade-up">
        <div class="text-center mb-16"><h2 class="text-4xl font-black mb-4 gradient-text uppercase tracking-widest">Bestiary</h2></div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
            <div class="glass p-8 rounded-3xl hover:border-sky-500/50 transition">
                <span class="text-4xl">🐲</span>
                <h3 class="font-bold mt-4 text-white">ドラゴン</h3>
            </div>
            <div class="glass p-8 rounded-3xl hover:border-sky-500/50 transition">
                <span class="text-4xl">🐺</span>
                <h3 class="font-bold mt-4 text-white">ウルフ</h3>
            </div>
            <div class="glass p-8 rounded-3xl hover:border-sky-500/50 transition">
                <span class="text-4xl">🧙</span>
                <h3 class="font-bold mt-4 text-white">メイジ</h3>
            </div>
            <div class="glass p-8 rounded-3xl hover:border-sky-500/50 transition">
                <span class="text-4xl">💎</span>
                <h3 class="font-bold mt-4 text-white">スライム</h3>
            </div>
        </div>
    </section>
</main>

<footer class="py-16 glass border-t border-white/10 text-center">
    <p class="text-slate-700 text-[10px] font-bold tracking-[0.3em] uppercase">&copy; 2026 SGB PROJECT</p>
</footer>

<script src="[https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js](https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js)"></script>
<script src="nav.js"></script>
<script>
    AOS.init({ duration: 1000, once: true });
</script>
</body>
</html>
