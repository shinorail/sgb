<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
body {

background-color: #020617;
color: #f1f5f9;

    <section id="about" class="grid lg:grid-cols-2 gap-16 items-center" data-aos="fade-right">

<script src="[https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js](https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js)"></script>
<script src="nav.js"></script>
<script>
    AOS.init({ duration: 1000, once: true });
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2;
            this.speed = Math.random() * 0.5 + 0.1;
            this.opacity = Math.random() * 0.5;
        }
        update() {
            this.y -= this.speed;
            if (this.y < 0) this.y = canvas.height;
        }
        draw() {
            ctx.fillStyle = `rgba(96, 165, 250, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    function createParticles() {
        particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }
    }
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }
    window.addEventListener('resize', () => {
        initCanvas();
        createParticles();
    });
    initCanvas();
    createParticles();
    animate();
</script>
</body>
</html>
