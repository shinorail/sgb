<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGB</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h1 {
            border-bottom: 2px solid #0056b3;
            padding-bottom: 8px;
            margin-top: 0;
            font-size: 1.75rem;
        }
        h2 {
            font-size: 1.25rem;
            margin-top: 24px;
        }
        .nav-links {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .nav-button {
            display: inline-block;
            padding: 12px 20px;
            background-color: #0056b3;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            transition: background-color 0.2s ease;
        }
        .nav-button:hover {
            background-color: #003d80;
        }

        /* モバイル対応（画面幅600px以下） */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 20px 16px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .nav-links {
                flex-direction: column;
                gap: 10px;
            }
            .nav-button {
                width: 100%;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SGB</h1>
    <p>SGBへようこそ。</p>

    <h2>規約類 / Documentation</h2>
    <div class="nav-links">
        <a href="terms/" class="nav-button">利用規約 (日本語)</a>
        <a href="terms/en/" class="nav-button">Terms of Service (English)</a>
    </div>
</div>

</body>
</html>
