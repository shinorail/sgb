<!DOCTYPE html>

<html lang="ja">
<head>

<title>SGB Official Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

    body { 
        font-family: 'Noto Sans JP', sans-serif; 
        background-color: #020617; 
        color: #f1f5f9; 
        margin: 0;
        overflow-x: hidden;
    }

    .glass { 
        background: rgba(15, 23, 42, 0.8); 
        backdrop-filter: blur(20px); 
        border: 1px solid rgba(255, 255, 255, 0.05); 
    }

    .gradient-text { 
        background: linear-gradient(135deg, #60a5fa, #c084fc); 
        -webkit-background-clip: text; 
        -webkit-text-fill-color: transparent; 
    }

    #mobile-menu { 
        transition: transform 0.3s ease-in-out; 
        transform: translateX(100%); 
    }
</style>
</head>
<body>
<nav class="fixed top-0 left-0 w-full z-50 glass px-4 md:px-8 py-4 flex justify-between items-center border-b border-white/10">
<div class="flex items-center gap-3">
<a href="index.html" class="flex items-center gap-3 text-white no-underline">
<div class="w-10 h-10 bg-gradient-to-br from-sky-500 to-indigo-600 rounded-lg flex items-center justify-center shadow-lg shadow-sky-500/20">
<i class="fas fa-sword text-white"></i>
</div>
<span class="text-xl font-black tracking-tighter">SGB <span class="text-sky-400">PROJECT</span></span>
</a>
</div>

    <div class="hidden lg:flex items-center gap-6 text-xs font-bold uppercase tracking-widest">
        <a href="index.html" class="text-white hover:text-sky-400 transition no-underline">Home</a>
        <a href="#about" class="text-white hover:text-sky-400 transition no-underline">About</a>
        <a href="#monster" class="text-white hover:text-sky-400 transition no-underline">Bestiary</a>
        <a href="commands.html" class="text-white hover:text-sky-400 transition no-underline">Guide</a>
        <a href="[https://discord.gg/cV9ECW5KG2](https://discord.gg/cV9ECW5KG2)" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-full transition shadow-lg shadow-indigo-500/30 no-underline">Join Discord</a>
    </div>

    <button id="menu-btn" class="lg:hidden text-white bg-transparent border-none cursor-pointer">
        <i class="fas fa-bars text-2xl"></i>
    </button>
</nav>

<div id="mobile-menu" class="fixed inset-0 z-[60] bg-slate-950/98 backdrop-blur-xl flex flex-col items-center justify-center gap-8 lg:hidden translate-x-full">
    <button id="close-btn" class="absolute top-6 right-6 text-white text-3xl bg-transparent border-none cursor-pointer">
        <i class="fas fa-times"></i>
    </button>
    <a href="index.html" class="text-2xl font-black uppercase text-white no-underline">Home</a>
    <a href="#about" class="text-2xl font-black uppercase text-white no-underline">About</a>
    <a href="#monster" class="text-2xl font-black uppercase text-white no-underline">Bestiary</a>
    <a href="commands.html" class="text-2xl font-black uppercase text-white no-underline">Guide</a>
    <a href="[https://discord.gg/cV9ECW5KG2](https://discord.gg/cV9ECW5KG2)" target="_blank" class="text-2xl font-black text-indigo-400 uppercase no-underline">Discord</a>
</div>

<header class="relative pt-48 pb-24 px-6 text-center">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-6xl md:text-8xl font-black mb-8 leading-[1.1] tracking-tight text-white">
            新時代の<br><span class="gradient-text">放置型RPG。</span>
        </h1>
        <p class="text-xl text-slate-400 mb-12 max-w-2xl mx-auto">
            Discordを開くだけで、そこは異世界。
        </p>
        <div class="flex flex-wrap justify-center gap-6">
            <a href="[https://discord.gg/cV9ECW5KG2](https://discord.gg/cV9ECW5KG2)" target="_blank" class="bg-sky-500 text-white font-black py-4 px-12 rounded-2xl shadow-lg shadow-sky-500/20 hover:scale-105 transition no-underline">
                今すぐ開始
            </a>
            <a href="commands.html" class="glass font-bold py-4 px-12 rounded-2xl hover:bg-white/10 transition text-white no-underline">
                ガイドを見る
            </a>
        </div>
    </div>
</header>

<main class="max-w-6xl mx-auto px-6 space-y-40 pb-40">
    <section id="about" class="grid lg:grid-cols-2 gap-16 items-center">
        <div>
            <h2 class="text-4xl font-black mb-8 italic underline decoration-sky-500 underline-offset-8 text-white">
                SGBとは？
            </h2>
            <p class="text-slate-300 text-lg leading-relaxed">
                24時間稼働するサーバー上で、あなたのキャラクターは常に成長を続けます。仕事中も、睡眠中も、冒険は止まりません。
            </p>
        </div>
        <div class="glass p-2 rounded-[40px] overflow-hidden">
            <img src="[https://images.unsplash.com/photo-1614728263952-84ea256f9679?auto=format&fit=crop&q=80&w=800](https://images.unsplash.com/photo-1614728263952-84ea256f9679?auto=format&fit=crop&q=80&w=800)" alt="SGBの冒険" class="rounded-[32px] w-full h-[400px] object-cover">
        </div>
    </section>

    <section id="monster">
        <div class="text-center mb-16">
            <h2 class="text-4xl font-black mb-4 gradient-text uppercase tracking-widest">
                Bestiary
            </h2>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
            <div class="glass p-8 rounded-3xl border border-white/5 transition hover:border-sky-500/50">
                <span class="text-4xl">🐲</span>
                <h3 class="font-bold mt-4 text-white">ドラゴン</h3>
            </div>
            <div class="glass p-8 rounded-3xl border border-white/5 transition hover:border-sky-500/50">
                <span class="text-4xl">🐺</span>
                <h3 class="font-bold mt-4 text-white">ウルフ</h3>
            </div>
            <div class="glass p-8 rounded-3xl border border-white/5 transition hover:border-sky-500/50">
                <span class="text-4xl">🧙</span>
                <h3 class="font-bold mt-4 text-white">メイジ</h3>
            </div>
            <div class="glass p-8 rounded-3xl border border-white/5 transition hover:border-sky-500/50">
                <span class="text-4xl">💎</span>
                <h3 class="font-bold mt-4 text-white">スライム</h3>
            </div>
        </div>
    </section>
</main>

<footer class="py-16 glass border-t border-white/10 text-center">
    <p class="text-slate-700 text-[10px] font-bold tracking-[0.3em] uppercase">
        &copy; 2026 SGB PROJECT | ALL RIGHTS RESERVED
    </p>
</footer>

<script>
    const menuBtn = document.getElementById('menu-btn');
    const closeBtn = document.getElementById('close-btn');
    const mobileMenu = document.getElementById('mobile-menu');

    menuBtn.onclick = () => {
        mobileMenu.classList.remove('translate-x-full');
    };

    closeBtn.onclick = () => {
        mobileMenu.classList.add('translate-x-full');
    };

    mobileMenu.querySelectorAll('a').forEach(link => {
        link.onclick = () => {
            mobileMenu.classList.add('translate-x-full');
        };
    });
</script>
</body>
</html>
