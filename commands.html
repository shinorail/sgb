<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide & Reference | SGB PROJECT</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
body { font-family: 'Noto Sans JP', sans-serif; background-color: #020617; color: #f1f5f9; scroll-behavior: smooth; overflow-x: hidden; }
.glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
.gradient-text { background: linear-gradient(135deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
#bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.tab-btn.active { border-bottom: 2px solid #60a5fa; color: #60a5fa; }
#mobile-menu { transition: transform 0.3s ease-in-out; transform: translateX(100%); }
#mobile-menu.active { transform: translateX(0); }
code { background: rgba(255, 255, 255, 0.1); padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #fbbf24; }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="nav-container"></div>
<div class="max-w-6xl mx-auto px-6 py-20">
<header class="mb-16 text-center" data-aos="fade-up">
<h1 class="text-5xl font-black mb-4 uppercase tracking-tighter">Guide & <span class="gradient-text">Reference</span></h1>
<p class="text-slate-400">冒険に必要なすべての知識がここにあります</p>
</header>
<div class="flex flex-wrap justify-center gap-4 mb-12 border-b border-white/10" data-aos="fade-up">
<button class="tab-btn active px-6 py-3 font-bold transition" onclick="showTab('commands')">コマンド</button>
<button class="tab-btn px-6 py-3 font-bold transition" onclick="showTab('changelog')">更新履歴</button>
<button class="tab-btn px-6 py-3 font-bold transition" onclick="showTab('faq')">FAQ</button>
</div>
<div id="commands" class="tab-content active space-y-12" data-aos="fade-up">
<div class="grid md:grid-cols-2 gap-8">
<div class="glass p-8 rounded-3xl border-l-4 border-sky-500">
<h3 class="text-xl font-bold mb-4 flex items-center gap-2">
<i class="fas fa-user text-sky-500"></i> Profile
</h3>
<code class="/profile</code>
<p class="text-sm text-slate-400 mt-2">現在のステータス、装備、所持品を一目で確認します。</p>
</div>
<div class="glass p-8 rounded-3xl border-l-4 border-red-500">
<h3 class="text-xl font-bold mb-4 flex items-center gap-2">
<i class="fas fa-sword text-red-500"></i> Adventure
</h3>
<code class="/adventure</code>
<p class="text-sm text-slate-400 mt-2">指定したエリアの探索を開始します。放置中も報酬を獲得可能です。</p>
</div>
</div>
</div>
<div id="changelog" class="tab-content space-y-8" data-aos="fade-up">
<div class="relative pl-8 border-l-2 border-sky-500/30">
<div class="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-sky-500"></div>
<span class="text-sky-400 font-bold">2026.03.10</span>
<h3 class="text-2xl font-black mt-2 uppercase">v2.6.0 Gold Rush</h3>
<p class="mt-4 text-slate-400">新エリア黄金の砂漠の追加を行いました。</p>
</div>
</div>
<div id="faq" class="tab-content max-w-3xl mx-auto space-y-4" data-aos="fade-up">
<details class="glass rounded-2xl group overflow-hidden">
<summary class="p-6 cursor-pointer font-bold flex justify-between items-center">
無料で遊べますか？
<i class="fas fa-chevron-down group-open:rotate-180 transition"></i>
</summary>
<div class="p-6 text-slate-400 border-t border-white/5 bg-white/2">
はい、SGBプロジェクトは完全無料で提供されています。
</div>
</details>
</div>
</div>
<footer class="py-16 glass border-t border-white/10 text-center text-slate-700 text-[10px] font-bold">&copy; 2026 SGB PROJECT</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script src="nav.js"></script>
<script>
AOS.init({ duration: 800 });
function showTab(tabId) {
document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
document.getElementById(tabId).classList.add('active');
event.currentTarget.classList.add('active');
}
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
class Particle {
constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 1.5; this.speed = Math.random() * 0.2 + 0.1; this.opacity = Math.random() * 0.3; }
update() { this.y -= this.speed; if (this.y < 0) this.y = canvas.height; }
draw() { ctx.fillStyle = rgba(96, 165, 250, ${this.opacity}); ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
}
function createParticles() { particles = []; for (let i = 0; i < 50; i++) particles.push(new Particle()); }
function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
window.addEventListener('resize', () => { initCanvas(); createParticles(); });
initCanvas(); createParticles(); animate();
</script>
</body>
</html>
